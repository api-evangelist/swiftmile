aid: swiftmile
name: Swiftmile
description: >-
  Swiftmile is a California-based hardware and IoT company building universal charging and parking
  infrastructure for micromobility — docking stations that power, secure and organize shared and
  privately owned e-bikes and e-scooters, including solar-powered units and integrated digital
  advertising panels. Founded around 2014 and headquartered on the San Francisco Peninsula, it
  supplied secure charging docks to the New York City DOT public e-bike charging pilot alongside
  PopWheels and Swobbee. Company interviews describe a fleet- and battery-management backend with
  integrations offered to micromobility operators, but Swiftmile has never published a public
  developer program, API reference, SDK, or machine-readable contract of any kind, and as of
  2026-08-29 swiftmile.com no longer serves the company website at all — the domain answers with a
  Nexcess hosting placeholder and a TLS certificate that does not match the hostname.
